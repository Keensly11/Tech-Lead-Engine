# What we sell, and which signals make each product line relevant.
# Used to tell sales which product line to lead with (and later by the email drafter).

# Sender details used in every email draft. Put your real details in
# config/sender.yaml (git-ignored; copy sender.example.yaml). They override these
# placeholders. Drafts can't be approved while placeholders are in use.
company:
  name: "YOUR COMPANY NAME"
  website: "https://example.com"
  phone: "+971 00 000 0000"
  email: "sales@example.com"
  signature: "The YOUR COMPANY NAME Sales Team"

# spoken:   how a person would say it in an email ("laptops and desktops", not the catalogue label).
# signals:  signal types that make a line relevant in general.
# keywords: equipment words that, when the article names them (e.g. a tender for
#           "400 laptops and 25 displays"), make the email pitch exactly those lines.
product_lines:
  laptops_desktops:
    label: "Laptops & desktops"
    spoken: "laptops and desktops"
    signals: [hiring_surge, new_office, new_company, funding_round, it_tender]
    keywords: [laptop, laptops, notebook, notebooks, desktop, desktops, computer, computers, pc, pcs]
  peripherals:
    label: "Monitors, docks & peripherals"
    spoken: "monitors and accessories"
    signals: [hiring_surge, new_office, new_company]
    keywords: [monitor, monitors, display, displays, screen, screens, dock, docks, keyboard, keyboards, peripheral, peripherals, printer, printers]
  servers_networking:
    label: "Servers, storage & networking"
    spoken: "servers and networking gear"
    signals: [it_hiring, new_office, it_tender]
    keywords: [server, servers, storage, network, networking, switch, switches, firewall, data centre, data center, wifi, wi-fi]
  cameras_av:
    label: "Cameras, lenses & AV equipment"
    spoken: "cameras, lenses and AV gear"
    signals: [production_launch]
    keywords: [camera, cameras, lens, lenses, av, audio-visual, audiovisual, projector, projectors, microphone, microphones, video wall]
  workstations:
    label: "Editing & rendering workstations"
    spoken: "editing workstations"
    signals: [production_launch]
    keywords: [workstation, workstations, editing, rendering, post-production, vfx]
