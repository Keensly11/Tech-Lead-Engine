[project]
name = "lead-engine"
version = "0.1.0"
description = "Signal-based B2B lead discovery, confidence scoring and CRM routing for a UAE tech reseller"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=2.2,<3",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lead-engine = "lead_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_engine = ["ui/templates/*.html"]  # index.html, _why.html

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
